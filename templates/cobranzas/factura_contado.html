<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: DejaVu Sans, sans-serif; color: #2c3e50; }
      .page { padding: 20px; max-width: 820px; margin: 0 auto; }
      .header { margin-bottom: 14px; }
      .brand { display: inline-block; vertical-align: top; }
      .brand .logo { max-height: 60px; max-width: 160px; }
      .company { display: inline-block; vertical-align: top; margin-left: 12px; font-size: 12px; }
      .company-name { font-size: 16px; font-weight: 700; margin-bottom: 2px; color: #1b3558; }
      .invoice-box { float: right; width: 40%; border: 1px solid #e0e4ea; padding: 10px; border-radius: 6px; background: #fbfdff; }
      .invoice-title { font-size: 18px; font-weight: 700; margin: 0 0 6px 0; color: #0f2b57; }
      .meta-line { font-size: 12px; margin: 2px 0; }
      .details { clear: both; margin-top: 8px; margin-bottom: 12px; }
      .details table { width: 100%; border-collapse: collapse; }
      .details td { padding: 4px 6px; vertical-align: top; }
      .details .meta { width: 50%; }
      .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
      .invoice-table th,
      .invoice-table td { border: 1px solid #e1e6ee; padding: 8px; font-size: 12px; }
      .invoice-table th { background: #f3f6fa; text-align: left; }
      .invoice-table td { background: #ffffff; }
      .totals { width: 100%; border-collapse: collapse; margin-top: 8px; }
      .totals td { padding: 8px; font-size: 12px; }
      .totals .label { text-align: right; padding-right: 12px; color: #333; }
      .totals .total { font-size: 15px; font-weight: 700; color: #0b2540; }
      .footer { margin-top: 18px; font-size: 11px; color: #555; }
      .small-muted { font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    {% include 'cobranzas/_factura_contado_body.html' %}
  </body>
</html>
