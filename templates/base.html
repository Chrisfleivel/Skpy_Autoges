<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <title>SKPY AutoGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/themes/'|add:theme_class|add:'.css' %}" id="theme-stylesheet">
    
</head>
<body class="{{ theme_class }}" data-theme="{{ theme_class }}">
    
    <style>
        :root {
            font-family: {{ font_family|default:"'Roboto', sans-serif" }};
            font-size: {{ base_size|default:"16px" }};
        }

        /* Estilos base que se aplican a todos los temas */
        .form-page-wrapper {
            min-height: 100vh;
            padding: 3rem 0;
        }

        .custom-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .custom-card-header {
            color: white;
            padding: 1.5rem;
            border: none;
        }

        .form-section-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .btn-save {
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-1px);
        }

        .btn-agregar {
            border: none;
            background-color: #28a745;
            color: #ffffff;
            padding: 0.8rem 1.25rem;
            border-radius: 0.65rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }

        .btn-agregar:hover,
        .btn-agregar:focus {
            background-color: #218838;
            color: #ffffff;
        }

        .btn-agregar i {
            margin-right: 0.35rem;
        }

        /* Estilo global para hover en tablas de resultados */
        .results-card .table tbody tr:hover {
            {% if theme_class == 'theme-dark' %}
              background-color: rgba(255, 255, 255, 0.08);
            {% elif theme_class == 'theme-emerald' %}
              background-color: rgba(16, 185, 129, 0.08);
            {% elif theme_class == 'theme-sunset' %}
              background-color: rgba(245, 158, 11, 0.08);
            {% elif theme_class == 'theme-ocean' %}
              background-color: rgba(59, 130, 246, 0.08);
            {% elif theme_class == 'theme-light' %}
              background-color: rgba(0, 0, 0, 0.08);
            {% else %}
              background-color: rgba(13, 110, 253, 0.08);
            {% endif %}
        }
    </style>

    {% include '_navbar2.html' %}
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function updateTheme(newTheme) {
            const themeLink = document.getElementById('theme-stylesheet');
            const themeSelector = document.getElementById('theme-selector');
            const themeBasePath = "{% static 'css/themes/' %}";
            if (themeLink) {
                themeLink.setAttribute('href', themeBasePath + newTheme + '.css');
            }
            document.body.className = newTheme;
            document.body.dataset.theme = newTheme;
            if (themeSelector) {
                themeSelector.value = newTheme;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const themeSelector = document.getElementById('theme-selector');
            const csrftoken = getCookie('csrftoken');
            const currentTheme = '{{ theme_class }}';

            if (themeSelector) {
                themeSelector.addEventListener('change', function () {
                    const selectedTheme = this.value;
                    updateTheme(selectedTheme);

                    {% if user.is_authenticated %}
                    fetch("{% url 'cambiar_tema' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken,
                        },
                        body: JSON.stringify({ tema: selectedTheme }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status !== 'success') {
                            console.error('No se pudo guardar la preferencia de tema.');
                        }
                    })
                    .catch(error => {
                        console.error('Error al guardar preferencia de tema:', error);
                    });
                    {% else %}
                    localStorage.setItem('theme', selectedTheme);
                    {% endif %}
                });
            }

            {% if not user.is_authenticated %}
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme && savedTheme !== currentTheme) {
                updateTheme(savedTheme);
            }
            {% endif %}
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
