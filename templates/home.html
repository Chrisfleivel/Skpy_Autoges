{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container py-5">
    <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
            <img src="{% static 'img/skpy_logo.png' %}" alt="SKPY Logo" width="120" class="mb-4">
            <h1 class="display-4 fw-bold mb-3" style="color:#0d6efd;">Bienvenido a SKPY AutoGest</h1>
            
            
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg me-2">Iniciar sesión</a>
            
        </div>
        <div class="col-md-6 text-center">
            <img src="{% static 'img/vehiculos_banner.jpg' %}" alt="Vehículos SKPY" class="img-fluid rounded shadow" style="max-height: 350px;">
        </div>
    </div>
    <div class="row mt-5">
        <div class="col text-center">
            <h3 class="fw-bold mb-3" style="color:#198754;">Transformando la gestión de la movilidad en Paraguay</h3>
            <p class="text-muted">
                Automatiza tareas, centraliza información y lleva tu empresa al siguiente nivel con SKPY AutoGest.
            </p>
        </div>
    </div>
</div>

{% endblock %}
