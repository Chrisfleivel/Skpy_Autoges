{% extends "base.html" %}

{% block title %}Eliminar Moneda{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="bg-danger bg-opacity-10 rounded-3 p-3">
      <i class="bi bi-trash fs-3 text-danger"></i>
    </div>
    <div>
      <h1 class="h3 fw-bold mb-1">Eliminar Moneda</h1>
      <p class="text-muted mb-0">Esta acción no puede ser revertida.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong>Advertencia:</strong> ¿Estás seguro de que deseas eliminar la moneda <strong>{{ moneda.codigo }} - {{ moneda.nombre }}</strong>?
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-2"></i>Confirmar Eliminación
          </button>
          <a href="{% url 'lista_monedas' %}" class="btn btn-secondary">
            <i class="bi bi-x-circle me-2"></i>Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
