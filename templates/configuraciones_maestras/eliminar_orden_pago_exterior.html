{% extends 'base.html' %}

{% block title %}Eliminar orden{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">
    <div class="card-header bg-danger text-white">
      <h4 class="mb-0">Eliminar orden</h4>
    </div>
    <div class="card-body">
      <p>¿Desea eliminar la orden de pago exterior para <strong>{{ orden.beneficiario }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between">
          <a href="{% url 'lista_ordenes_pago_exterior' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">Eliminar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
