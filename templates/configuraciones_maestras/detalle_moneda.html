{% extends "base.html" %}

{% block title %}Detalle de Moneda{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 fw-bold">{{ moneda.codigo }}</h1>
      <p class="text-muted mb-0">{{ moneda.nombre }}</p>
    </div>
    <div class="d-flex gap-2">
      <a href="{% url 'editar_moneda' moneda.id %}" class="btn btn-outline-secondary">
        <i class="bi bi-pencil me-2"></i>Editar
      </a>
      <a href="{% url 'lista_monedas' %}" class="btn btn-outline-primary">
        <i class="bi bi-arrow-left me-2"></i>Volver
      </a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="row">
        <div class="col-md-6 mb-3">
          <dt class="fw-semibold text-muted">Código</dt>
          <dd class="h5">{{ moneda.codigo }}</dd>
        </div>
        <div class="col-md-6 mb-3">
          <dt class="fw-semibold text-muted">Nombre</dt>
          <dd class="h5">{{ moneda.nombre }}</dd>
        </div>
      </div>

      <hr class="my-4">

      <div class="row">
        <div class="col-md-12">
          <a href="{% url 'eliminar_moneda' moneda.id %}" class="btn btn-outline-danger">
            <i class="bi bi-trash me-2"></i>Eliminar Moneda
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
