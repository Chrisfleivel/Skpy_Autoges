{% extends 'base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
  <div class="container-fluid py-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 text-center">
            <h4 class="fw-bold">Eliminar Cliente</h4>
            <p class="text-muted">¿Estás seguro de que deseas eliminar al cliente "{{ cliente.nombre }}"?</p>
            <form method="post">
              {% csrf_token %}
              <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-danger">Eliminar</button>
                <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
