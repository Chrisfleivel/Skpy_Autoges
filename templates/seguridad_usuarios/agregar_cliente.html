
{% extends 'base.html' %}

{% block title %}Agregar Cliente{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-xl-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 py-3 d-flex align-items-center justify-content-between">
          <div>
            <h5 class="mb-0 fw-bold">Registrar Cliente</h5>
            <p class="text-muted mb-0">Agrega un nuevo cliente al sistema.</p>
          </div>
          <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver
          </a>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-danger">
              {{ form.non_field_errors }}
            </div>
            {% endif %}

            <div class="row g-3">
              {{ form.as_p }}
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
              <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle me-2"></i>Cancelar
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-2"></i>Guardar Cliente
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
